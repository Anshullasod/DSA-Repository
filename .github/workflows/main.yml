name: Update README Count
on:
  push:
    branches:
      - main  # Agar aapki branch ka naam 'master' hai toh wo likhein
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run Update Script
        run: python update_count.py
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update problem count" || exit 0
          git push
